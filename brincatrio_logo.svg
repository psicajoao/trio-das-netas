<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7A6"/><stop offset=".45" stop-color="#FFD84D"/><stop offset="1" stop-color="#FF9D25"/>
    </linearGradient>
    <linearGradient id="aqua" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9FFFF"/><stop offset=".45" stop-color="#58DDF5"/><stop offset="1" stop-color="#168BDB"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB9E8"/><stop offset=".5" stop-color="#FF72BD"/><stop offset="1" stop-color="#D9368A"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9FF9D"/><stop offset=".5" stop-color="#8DE85C"/><stop offset="1" stop-color="#39B85D"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8C7FF"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#7251D6"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dx="0" dy="14" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope=".42"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <!-- Sparkles -->
  <g fill="#FFD95A" stroke="#FFF6C7" stroke-width="4" stroke-linejoin="round">
