  </g>

  <!-- Wordmark -->
  <g font-family="Trebuchet MS, Arial Rounded MT Bold, Arial, sans-serif" font-weight="900" text-anchor="middle" stroke-linejoin="round" filter="url(#shadow)">
    <text x="600" y="385" font-size="143" letter-spacing="-6" fill="#172D62" stroke="#172D62" stroke-width="31">Brinca</text>
    <text x="600" y="370" font-size="143" letter-spacing="-6" fill="url(#gold)" stroke="#FFFFFF" stroke-width="14">Brinca</text>
    <text x="600" y="520" font-size="158" letter-spacing="-3" fill="#172D62" stroke="#172D62" stroke-width="32">Trio!</text>
    <text x="600" y="505" font-size="158" letter-spacing="-3" fill="url(#aqua)" stroke="#FFFFFF" stroke-width="14">Trio!</text>
  </g>
  <!-- Gloss highlights -->
  <path d="M398 284 Q600 244 797 284" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity=".45"/>
  <path d="M450 428 Q600 408 749 428" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".35"/>

