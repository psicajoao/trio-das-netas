      <path d="M42 38 Q70 18 101 28" fill="none" stroke="#FFF7C7" stroke-width="10" stroke-linecap="round"/>
      <ellipse cx="75" cy="78" rx="17" ry="23" fill="#FFFFFF"/>
      <ellipse cx="126" cy="78" rx="17" ry="23" fill="#FFFFFF"/>
      <ellipse cx="79" cy="83" rx="8" ry="12" fill="#263858"/>
      <ellipse cx="122" cy="83" rx="8" ry="12" fill="#263858"/>
