    <circle cx="1000" cy="430" r="5"/><circle cx="275" cy="555" r="5"/>
  </g>
  <g fill="none" stroke="#8CEBFF" stroke-width="6" opacity=".9">
    <circle cx="1048" cy="367" r="17"/><circle cx="170" cy="405" r="12"/><circle cx="270" cy="236" r="8"/>
  </g>

