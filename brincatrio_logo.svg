      <ellipse cx="68" cy="83" rx="6" ry="9" fill="#263858"/><ellipse cx="98" cy="83" rx="6" ry="9" fill="#263858"/>
      <path d="M69 104 Q83 115 97 103" fill="none" stroke="#246B44" stroke-width="6" stroke-linecap="round"/>
